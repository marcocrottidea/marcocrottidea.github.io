<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marco Crotti — web developer</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      body {
        font:
          17px/1.6 ui-serif,
          Georgia,
          serif;
      }
    </style>
  </head>
  <body class="bg-[#fbf8f2]">
    <div class="max-w-7xl mx-auto px-6 py-24">
      <div class="space-y-6">
        <div>
          <p class="text-[#a8842c] tracking-widest">@marcocrottidea</p>
          <h1 class="text-6xl font-bold text-olive-800 tracking-tight">
            Marco Crotti
          </h1>
        </div>
        <p class="max-w-lg text-olive-600">
          Web developer in De Agostini Publishing. Faccio pagine che si caricano
          prima che tu finisca di leggere il titolo.
        </p>
        <p>
          Scrivimi:
          <a
            href="mailto:marco.crotti@deagostini.com"
            class="underline decoration-[#a8842c] decoration-2 font-semibold"
            >marco.crotti@deagostini.com</a
          >
        </p>
        <div id="debug" class="text-olive-500"></div>
      </div>
    </div>
    <script>
      if (new URLSearchParams(location.search).has("dev")) {
        document.getElementById("debug").insertAdjacentHTML(
          "afterbegin",
          `<pre style="color:var(--gold);font-size:.75rem">ua: ${navigator.userAgent}
viewport: ${innerWidth}x${innerHeight} · dpr: ${devicePixelRatio}
build: statico, come Dio comanda</pre>`,
        );
      }
    </script>
  </body>
</html>
