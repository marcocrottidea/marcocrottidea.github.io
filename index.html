<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marco Crotti — web developer</title>
    <meta
      name="description"
      content="Marco Crotti, web developer in De Agostini Publishing. Pagine statiche che si caricano subito."
    />
    <meta name="theme-color" content="#fbf8f2" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
      :root {
        --gold: #8a6a1c;
        --olive-800: #3c4226;
        --olive-600: #5b6238;
        --olive-500: #6e7547;
      }
      body {
        font: 17px/1.6 ui-serif, Georgia, serif;
        background: #fbf8f2;
        color: var(--olive-800);
        margin: 0;
      }
      main {
        max-width: 80rem;
        margin: 0 auto;
        padding: 6rem 1.5rem;
      }
      .handle {
        color: var(--gold);
        letter-spacing: 0.1em;
        margin: 0;
      }
      h1 {
        font-size: clamp(2.5rem, 8vw, 3.75rem);
        line-height: 1.1;
        letter-spacing: -0.025em;
        margin: 0.25rem 0 1.5rem;
      }
      p {
        max-width: 32rem;
        color: var(--olive-600);
      }
      a {
        color: inherit;
        font-weight: 600;
        text-decoration: underline;
        text-decoration-color: var(--gold);
        text-decoration-thickness: 2px;
      }
      #debug {
        color: var(--olive-500);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="handle">@marcocrottidea</p>
      <h1>Marco Crotti</h1>
      <p>
        Web developer in De Agostini Publishing. Faccio pagine che si caricano
        prima che tu finisca di leggere il titolo.
      </p>
      <p>
        Scrivimi:
        <a href="mailto:marco.crotti@deagostini.com"
          >marco.crotti@deagostini.com</a
        >
      </p>
      <div id="debug"></div>
    </main>
    <script>
      if (new URLSearchParams(location.search).has("dev")) {
        const pre = document.createElement("pre");
        pre.style.cssText = "color:var(--gold);font-size:.75rem";
        pre.textContent = `ua: ${navigator.userAgent}
viewport: ${innerWidth}x${innerHeight} · dpr: ${devicePixelRatio}
build: statico, come Dio comanda`;
        document.getElementById("debug").prepend(pre);
      }
    </script>
  </body>
</html>
